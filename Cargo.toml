[package]
name = "relogio-retro"
version = "0.1.0"
edition = "2021"
description = "Relógio digital retro em verde sobre preto"
license = "MIT"

[dependencies]
chrono = "0.4"
minifb = { version = "0.29", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11-dl = "2.21"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

